<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <!-- Subtle ambient glow background -->
  <circle cx="600" cy="240" r="380" fill="url(#terracotta_glow)" opacity="0.25"/>
  <circle cx="1000" cy="500" r="280" fill="url(#bronze_glow)" opacity="0.15"/>
  
  <!-- Gradients -->
  <defs>
    <radialGradient id="terracotta_glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 240) rotate(90) scale(380)">
      <stop stop-color="#C85A32"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bronze_glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 500) rotate(90) scale(280)">
      <stop stop-color="#A48256"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Border Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="32" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" fill="none"/>
  
  <!-- Central Icon Badge -->
  <g transform="translate(560, 110)">
    <rect width="80" height="80" rx="24" fill="#C85A32" opacity="0.2" stroke="#C85A32" stroke-width="1.5"/>
    <circle cx="40" cy="40" r="20" stroke="#E07A5F" stroke-width="2.5" fill="none"/>
    <path d="M40 20v40M48 26H35a6 6 0 0 0 0 12h10a6 6 0 0 1 0 12H30" stroke="#E07A5F" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Title & Typography -->
  <text x="600" y="260" text-anchor="middle" fill="#E07A5F" font-family="sans-serif" font-size="16" font-weight="bold" letter-spacing="6">HUMANISMO DIGITAL &amp; SOBERANÍA NOÉTICA</text>
  <text x="600" y="340" text-anchor="middle" fill="#F5F5F4" font-family="serif" font-size="52" font-weight="bold" letter-spacing="1">EL CONSEJO DE LAS CIEN MIRADAS</text>
  <text x="600" y="405" text-anchor="middle" fill="#D6D3D1" font-family="serif" font-size="24" font-style="italic">Diálogo Filosófico ante la Inteligencia Artificial y la Técnica</text>

  <!-- Badges / Pillars at bottom -->
  <g transform="translate(200, 470)">
    <rect width="240" height="48" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="120" y="30" text-anchor="middle" fill="#A8A29E" font-family="sans-serif" font-size="14" font-weight="600">100 Pensadores Universales</text>
  </g>

  <g transform="translate(480, 470)">
    <rect width="240" height="48" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="120" y="30" text-anchor="middle" fill="#A8A29E" font-family="sans-serif" font-size="14" font-weight="600">10 Salas de Debate Dialéctico</text>
  </g>

  <g transform="translate(760, 470)">
    <rect width="240" height="48" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="120" y="30" text-anchor="middle" fill="#A8A29E" font-family="sans-serif" font-size="14" font-weight="600">Oráculo Socrático &amp; Manifiesto</text>
  </g>
</svg>